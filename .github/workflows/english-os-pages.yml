name: Deploy English OS to GitHub Pages

on:
  push:
    branches: ["master"]
    paths:
      - "english-os/**"
      - ".github/workflows/english-os-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "english-os-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload English OS
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./english-os"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
